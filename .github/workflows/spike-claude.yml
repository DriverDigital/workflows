name: Spike claude (reusable)

# Throwaway Phase 0 spike (docs/reusable-conversion-scope.md): does the Claude App token mint
# survive inside a SHA-pinned cross-repo reusable? Deleted once the result is recorded.
# main carries this line and the pinned SHA does not, so the pin differs from main in content.

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  claude:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          show_full_output: true
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --model sonnet --max-turns 15 --allowedTools "Bash(git:*),Bash(gh:*),Write"
          prompt: "Run these steps and nothing else. Create and check out a branch named spike-${{ github.run_id }}. Write a file SPIKE.md containing the single line: spike ${{ github.run_id }}. Commit it with the message spike, push the branch, then run gh pr create --draft --title spike --body spike. Stop once gh pr create prints a URL."

      # A workflow-validation failure ends the action green with no token minted; the declared
      # outputs carry no skip flag, so an empty github_token is the only observable sign.
      - name: Fail on a silent workflow-validation skip
        if: ${{ steps.claude.outcome == 'success' && steps.claude.outputs.github_token == '' }}
        run: |
          echo "::error::claude-code-action skipped on workflow validation: no token was minted and nothing ran."
          exit 1
