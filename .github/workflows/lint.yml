name: Lint workflows

# THIS REPO'S OWN CI — not a reusable, not part of the kit.
#
# The six reusables in .github/workflows/ are `workflow_call`-only, so they never run on this
# repo's own PRs; `dependabot-auto-merge.yml` is the one other file here that does, and it lints
# nothing. So before this file existed, nothing checked the workflows this repo SHIPS: a YAML or
# shell error in templates/github/ would sail through review and land in every consumer repo on the
# next fleet wave, where it surfaces as a silent `startup_failure` rather than a red check here.
#
# Lints BOTH halves — the six reusables in .github/workflows/ AND the kit in templates/github/,
# which is the actual product. actionlint also runs shellcheck over every `run:` block (shellcheck
# is preinstalled on ubuntu-latest), so the kit's shell is covered too.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned release + checksum instead of the upstream `rhysd/actionlint` action: the org
      # enforces a selected-actions allowlist, so a dependency-free download is one less thing to
      # get approved, and the checksum keeps it honest if a release asset is ever replaced.
      # Bump VERSION and SHA256 TOGETHER — Dependabot does not manage this pair.
      - name: Install actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -fsSL --max-time 120 -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint

      - name: Lint the reusables and the kit
        env:
          # SC2015 ("A && B || C is not if-then-else") is the ONLY exclusion, and it is a false
          # positive here: every hit is this repo's deliberate `cond && action || true`, where the
          # trailing C is a literal `true` — a no-op that exists so `set -e` doesn't abort when cond
          # is false. C running "unexpectedly" is precisely the intent, so there is nothing to fix.
          # Upstream agrees: shellcheck 0.11 no longer reports this shape at all, so the finding
          # only appears on the older shellcheck preinstalled on the runner. Excluded rather than
          # rewriting two load-bearing reusables to satisfy a check that is going away.
          SHELLCHECK_OPTS: --exclude=SC2015
        run: |
          set -euo pipefail
          # With no paths actionlint globs .github/workflows/ itself. The kit lives outside that
          # path, so it is passed explicitly — without the second call the files consumer repos
          # actually install would go unchecked, which is the whole point of this job.
          ./actionlint -color
          ./actionlint -color templates/github/*.yml

      - name: Every kit stub is pinned to a real SHA
        # A new reusable's stub ships with an all-zero placeholder pin so it cannot be installed
        # before the release tag exists. An unresolvable `uses:` ref fails the consumer's run as
        # `startup_failure` — which this repo's README documents as SILENT (no check run, no
        # notification). So the placeholder must never reach main: this is the gate that stops it.
        # Step 2 of the README's release order (repin the stubs) is what clears it.
        run: |
          set -euo pipefail
          if grep -rn 'DriverDigital/workflows/.*@0\{40\}' templates/github/; then
            echo "::error::A kit caller stub still carries the all-zero placeholder pin. Repin it to the release tag's SHA (README: 'Release + repin order', step 2) before merging."
            exit 1
          fi
          echo "all kit stubs carry a real SHA pin"

      - name: claude.yml system prompt survives tokenization
        # The --append-system-prompt value (conduct block + Shopify operator tripwire) is delimited
        # by SINGLE QUOTES for claude_args' shell-quote tokenizer. shell-quote does NOT throw on an
        # unterminated quote — it silently truncates, dropping the tail of the prompt. Every flag
        # still parses, the YAML stays valid, actionlint exits 0, and the wave copies the truncated
        # prompt to 18 branches green. One apostrophe typed into the canonical blockquote upstream
        # is enough. So assert the quote count directly: 4 is the correct total (allowedTools pair
        # + append-system-prompt pair). Any odd count means something ate a delimiter.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys, yaml, re
          d = yaml.safe_load(open("templates/github/claude.yml"))
          steps = d["jobs"]["claude"]["steps"]
          args = [s for s in steps if "claude_args" in (s.get("with") or {})][0]["with"]["claude_args"]
          q = args.count("'")
          if q != 4:
              print(f"::error::claude_args holds {q} single quotes, expected 4. An apostrophe in the "
                    f"system prompt truncates it silently — shell-quote does not error. Remove it.")
              sys.exit(1)
          m = re.search(r"--append-system-prompt '(.*?)'(?:\s|$)", args, re.S)
          if not m:
              print("::error::could not locate the --append-system-prompt value in claude_args")
              sys.exit(1)
          p = m.group(1)
          for ch, why in (("'", "truncates the token"), ("$", "shell-expands")):
              if ch in p:
                  print(f"::error::system prompt contains {ch!r}, which {why}")
                  sys.exit(1)
          print(f"claude_args tokenizes cleanly: 4 quotes, {len(p)}-char system prompt")
          PY

