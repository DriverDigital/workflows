name: Lint workflows

# THIS REPO'S OWN CI — not a reusable, not part of the kit.
#
# The reusables in .github/workflows/ are `workflow_call`-only, so they never run on this repo's
# own PRs, and a YAML or shell error in what this repo SHIPS surfaces in a consumer repo as a silent
# `startup_failure` rather than a red check here.
#
# Lints BOTH halves — the reusables in .github/workflows/ AND the kit in templates/github/,
# which is the actual product. actionlint also runs shellcheck over every `run:` block (shellcheck
# is preinstalled on ubuntu-latest), so the kit's shell is covered too.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Pinned release + checksum instead of the upstream `rhysd/actionlint` action: the org
      # enforces a selected-actions allowlist, so a dependency-free download is one less thing to
      # get approved, and the checksum keeps it honest if a release asset is ever replaced.
      # Bump VERSION and SHA256 TOGETHER — Dependabot does not manage this pair.
      - name: Install actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -fsSL --max-time 120 -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint

      - name: Lint the reusables and the kit
        env:
          # SC2015 flags the `cond && action || true` set -e idiom. Newer shellcheck no longer does,
          # but the runner's copy is older and actionlint fails on its INFO findings.
          SHELLCHECK_OPTS: --exclude=SC2015
        run: |
          set -euo pipefail
          # With no paths actionlint globs .github/workflows/ itself. The kit lives outside that
          # path, so it is passed explicitly — without the second call the files consumer repos
          # actually install would go unchecked. The kit's dependabot/ variants are not workflows
          # (actionlint rejects them outright), so they are excluded.
          ./actionlint -color
          find templates/github -name '*.yml' -not -path 'templates/github/dependabot/*' -exec ./actionlint -color {} +

      - name: Every kit stub is pinned to a real SHA
        # A new reusable's stub ships with an all-zero placeholder pin so it cannot be installed
        # before the release tag exists. An unresolvable `uses:` ref fails the consumer's run as a
        # SILENT `startup_failure` (no check run, no notification), so the placeholder must never
        # reach main. Repinning the stubs (release step 2) clears it.
        run: |
          set -euo pipefail
          if grep -rn 'DriverDigital/workflows/.*@0\{40\}' templates/github/; then
            echo "::error::A kit caller stub still carries the all-zero placeholder pin. Repin it to the release tag's SHA (README: 'Release + repin order', step 2) before merging."
            exit 1
          fi
          echo "all kit stubs carry a real SHA pin"

      - name: claude.yml system prompt survives tokenization
        # The --append-system-prompt value (conduct block, quality standard, Shopify tripwire) is delimited
        # by SINGLE QUOTES for claude_args' shell-quote tokenizer. shell-quote does NOT throw on an
        # unterminated quote — it silently truncates, dropping the tail of the prompt. Every flag
        # still parses, the YAML stays valid, actionlint exits 0, and the wave copies the truncated
        # prompt fleet-wide green. One apostrophe typed into the canonical blockquote upstream is
        # enough. So assert the quote count directly: 6 is the correct total (allowedTools,
        # mcp-config and append-system-prompt pairs). Any other count means a delimiter was eaten
        # or added. The prompt lives in the reusable; the kit's claude.yml is a stub with no steps.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys, yaml, re
          d = yaml.safe_load(open(".github/workflows/claude.yml"))
          steps = d["jobs"]["claude"].get("steps") or []
          found = [s["with"]["claude_args"] for s in steps if "claude_args" in (s.get("with") or {})]
          if len(found) != 1:
              sys.exit(f"::error::expected one claude_args in .github/workflows/claude.yml, found {len(found)} — this check proves nothing")
          args = found[0]
          q = args.count("'")
          if q != 6:
              print(f"::error::claude_args holds {q} single quotes, expected 6. An apostrophe in the "
                    f"system prompt truncates it silently — shell-quote does not error. Remove it.")
              sys.exit(1)
          m = re.search(r"--append-system-prompt '(.*?)'(?:\s|$)", args, re.S)
          if not m:
              print("::error::could not locate the --append-system-prompt value in claude_args")
              sys.exit(1)
          p = m.group(1)
          for ch, why in (("'", "truncates the token"), ("$", "shell-expands")):
              if ch in p:
                  print(f"::error::system prompt contains {ch!r}, which {why}")
                  sys.exit(1)
          # Same class of silent failure one level up, in the `prompt:` scalar. Its issue branch is a
          # format() call whose literal may hold only the {0} placeholder; any other brace makes the
          # expression fail AT RUNTIME (unmatched-brace / bad-format-string), which actionlint cannot
          # see — it does not parse inside a format() literal. The run dies before Claude starts.
          # The delimiters are stripped by REGEX, not str.replace, so this file holds no literal
          # dollar-brace-brace: actionlint lexes one inside a run: block as an expression and fails
          # the whole workflow. Do not "simplify" it back.
          prompt = [s for s in steps if "prompt" in (s.get("with") or {})][0]["with"]["prompt"]
          inner = re.sub(r"\$\{\{|\}\}", "", prompt)
          if re.findall(r"\{(?!0\})|(?<!\{0)\}", inner):
              sys.exit("::error::stray brace in claude.yml prompt scalar — format() accepts only {0}")
          print(f"claude_args tokenizes cleanly: 6 quotes, {len(p)}-char system prompt")
          PY


      - name: The Shopify blockquote matches driver-agents main
        # The blockquote in claude.yml's --append-system-prompt is a copy of driver-agents
        # docs/agent-instructions-shopify.md, and the implementer clones that repo's main for the
        # tool it describes. Compared with whitespace collapsed, since the copy flattens one
        # paragraph break. PRs only; one without the secret (Dependabot, a fork) skips the check.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.AGENTS_GH_PAT }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then echo "::notice::AGENTS_GH_PAT unavailable to this run; blockquote check skipped"; exit 0; fi
          gh api repos/DriverDigital/driver-agents/contents/docs/agent-instructions-shopify.md \
            -H 'Accept: application/vnd.github.raw' > "$RUNNER_TEMP/canon.md"
          python3 - "$RUNNER_TEMP/canon.md" <<'PY'
          import re, sys, unicodedata, yaml
          d = yaml.safe_load(open(".github/workflows/claude.yml"))
          args = [s["with"]["claude_args"] for s in d["jobs"]["claude"]["steps"] if "claude_args" in (s.get("with") or {})][0]
          prompt = re.search(r"--append-system-prompt '(.*?)'(?:\s|$)", args, re.S).group(1)
          start = "All Shopify Admin API calls go through"
          if start not in prompt:
              sys.exit(f"::error::claude.yml system prompt has no line starting {start!r}")
          norm = lambda t: re.sub(r"\s+", " ", unicodedata.normalize("NFC", t)).strip()
          ours = norm(prompt[prompt.index(start):])
          canon = norm("\n".join(re.sub(r"^> ?", "", l) for l in open(sys.argv[1]).read().splitlines() if l.startswith(">")))
          if ours != canon:
              i = next((k for k, (x, y) in enumerate(zip(ours, canon)) if x != y), min(len(ours), len(canon)))
              sys.exit("::error::the Shopify blockquote in claude.yml differs from driver-agents main "
                       f"docs/agent-instructions-shopify.md at char {i}:\n  ours:  ...{ours[max(0, i - 60):i + 80]}\n"
                       f"  main:  ...{canon[max(0, i - 60):i + 80]}\nRe-copy the blockquote from driver-agents.")
          print(f"blockquote matches driver-agents main ({len(ours)} chars)")
          PY

      - name: The kit's dependabot.yml variants match Dependabot's schema
        # The wave writes these to every target, and Dependabot rejects a bad config only once it
        # lands on a default branch, silently stopping that repo's updates (the stub pins included).
        run: pipx run check-jsonschema==0.38.2 --builtin-schema vendor.dependabot templates/github/dependabot/*.yml
