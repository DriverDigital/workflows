name: Vercel deploy (reusable)

# Deploys a Vercel site for pushes Vercel itself will not build, called by the kit stub
# templates/github/vercel-deploy.yml on push to main. Vercel's GitHub app deploys pushes by members
# of the Vercel team and blocks everyone else's, so this job fires the main deploy hook for everyone
# else and skips team members, whose push Vercel has already picked up. main is Vercel's production
# branch with auto-assigned production domains off, so either way the push stages a production build
# and nothing goes live until someone promotes it in Vercel.
#
# The team's GitHub logins come from the variable VERCEL_TEAM_LOGINS, space-separated and set per
# repo to the logins with a seat on that project's Vercel team; unset, it falls back to
# mcarter-astronautdev alone. A login missing from it deploys twice, once from each side.

on:
  workflow_call:
    secrets:
      VERCEL_DEPLOY_HOOK_MAIN:
        required: true

permissions: {}

jobs:
  deploy:
    if: >-
      !contains(format(' {0} ', vars.VERCEL_TEAM_LOGINS || 'mcarter-astronautdev'), format(' {0} ', github.actor))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fire the main deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_MAIN }}
        run: curl -fsS --max-time 20 -X POST "$HOOK"
