# House standard .github/dependabot.yml for every Driver repo. Keep the blocks the repo needs (actions
# always; npm where a package.json exists, one block per package.json directory) and change nothing
# else; a justified per-repo exception (an `ignore` for a pinned major) is commented where it sits.
#
# Every major arrives as its own pull request: each group takes only minor and patch updates, so a
# major falls out of its group and Dependabot opens it alone, where a breaking change can be handled
# without holding back everything else. Tailwind is grouped apart from other npm packages because
# its releases usually need migration work.
#
# No `target-branch`: Dependabot reads this file from the default branch and opens pull requests
# against it, which is `main` on Shopify sites and `develop` on Vercel sites. Palmers' main-* country
# branches get no Dependabot updates; the wave keeps their kit pins current.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # Daily, not monthly: the wave repins within minutes of a tag, so this only has to cover the repos
    # and tags the wave skips, and a monthly backstop is up to a month late
    # (DriverDigital/workflows docs/fleet-operations.md, "Dependabot and the wave").
    schedule:
      interval: "daily"
    # GitHub's default 3-day cooldown stays for third-party actions. Kit tags are exempt so a repo
    # the wave skipped (or cannot reach) bumps the day the tag lands, not three days later.
    cooldown:
      default-days: 3
      exclude:
        - "DriverDigital/workflows*"
    # Actions float on their major tag in the kit, so a run already has every minor and patch;
    # majors are the only action bumps that get a PR. This also closes the reported Dependabot edge
    # that rewrites a major-tag ref into a pinned patch, which would stop that copy floating.
    # Named, not "*": the DriverDigital/workflows stub pins are semver-minor bumps this block exists
    # to make, and a wildcard here would ignore them too.
    ignore:
      - dependency-name: "actions/*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "anthropics/*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    assignees:
      - "mcarter-astronautdev"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    assignees:
      - "mcarter-astronautdev"
    groups:
      tailwind:
        patterns: ["tailwindcss*", "@tailwindcss*"]
        update-types: ["minor", "patch"]
      other-dependencies:
        patterns: ["*"]
        exclude-patterns: ["tailwindcss*", "@tailwindcss*"]
        update-types: ["minor", "patch"]
