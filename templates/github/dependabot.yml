# The updater the kit's caller stubs rely on. Dependabot reads the `# vX.Y.Z` trailer on each
# `uses: DriverDigital/workflows/...@<sha>` pin and opens ONE grouped PR per new tag (any other
# action bump rides in the same group). Install as .github/dependabot.yml; a repo that already has
# one keeps its npm block and adds this entry. Dependabot scans the DEFAULT branch only — a repo
# carrying the kit on other branches needs one copy of this entry per branch with `target-branch:`.
# Daily, not monthly: the wave repins within minutes of a tag, so this only has to cover the repos
# and tags the wave skips — and a monthly backstop is up to a month late
# (DriverDigital/workflows docs/fleet-operations.md, "Dependabot and the wave").
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    # GitHub's default 3-day cooldown stays for third-party actions. Kit tags are exempt so a repo
    # the wave skipped (or cannot reach) bumps the day the tag lands, not three days later.
    cooldown:
      default-days: 3
      exclude:
        - "DriverDigital/workflows*"
    # The kit's claude.yml floats the action on `v1`, which Dependabot leaves alone by design; this
    # closes the reported edge where it bumps a major-tag ref to a patch anyway. Majors still flow.
    ignore:
      - dependency-name: "anthropics/claude-code-action"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    assignees:
      - "mcarter-astronautdev"
    groups:
      actions:
        patterns:
          - "*"
