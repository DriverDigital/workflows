name: Shopify tool smoke test

# Store repos only. A manual, read-only check of the Shopify admin tool's wiring: secrets, the pinned
# driver-agents clone, the token mint and the Admin API. It fails loudly where the implementer's
# provisioning degrades quietly.

on: workflow_dispatch

# The clone authenticates with AGENTS_GH_PAT.
permissions: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Above the clone's worst case (5 attempts x 120s plus backoff), so a cancel never hides the error.
    timeout-minutes: 15
    env:
      # The runner context is unavailable in job-level env, so the tool paths come from the step.
      SHOPIFY_STORE_NAME: ${{ vars.SHOPIFY_STORE_NAME }}
    steps:
      # The implementer's provisioning, but failing where that degrades. Keep the two in step, or the
      # smoke test checks wiring the implementer does not use.
      - name: Provision Shopify admin tool
        env:
          DRIVER_ENGINEERING_APP_CLIENT_ID: ${{ secrets.DRIVER_ENGINEERING_APP_CLIENT_ID }}
          DRIVER_ENGINEERING_APP_CLIENT_SECRET: ${{ secrets.DRIVER_ENGINEERING_APP_CLIENT_SECRET }}
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_STORE }}
          GH_TOKEN: ${{ secrets.AGENTS_GH_PAT }}
          # Must equal the claude.yml reusable's; DriverDigital/workflows lint.yml checks it.
          DRIVER_AGENTS_REF: 21a357cbfaa1d64190e60134b2f79240bcd6bb6b # main @ 2026-09-30 (field-description sentence; no box credential path)
          # Optional org secret; unset turns alerts off.
          SHOPIFY_ALERT_WEBHOOK: ${{ secrets.SHOPIFY_ALERT_WEBHOOK }}
        run: |
          for v in SHOPIFY_STORE_NAME DRIVER_ENGINEERING_APP_CLIENT_ID DRIVER_ENGINEERING_APP_CLIENT_SECRET SHOPIFY_SHOP GH_TOKEN; do
            [ -n "${!v}" ] || { echo "::error::$v is not set (repo secret missing, or the SHOPIFY_STORE_NAME repository variable unset?)"; exit 1; }
          done
          case "$SHOPIFY_STORE_NAME" in
            *[!a-zA-Z0-9._-]*|.*)
              echo "::error::SHOPIFY_STORE_NAME '$SHOPIFY_STORE_NAME' is not a plain store handle (allowed: A-Z a-z 0-9 . _ -, no leading dot)"
              exit 1 ;;
          esac
          set +e
          for i in 1 2 3 4 5; do
            # timeout lets the retries advance past a hung clone; a full clone keeps the pin reachable.
            timeout 120 gh repo clone DriverDigital/driver-agents "$RUNNER_TEMP/driver-agents" -- --quiet &&
              git -C "$RUNNER_TEMP/driver-agents" checkout -q "$DRIVER_AGENTS_REF" && break
            echo "driver-agents clone attempt $i failed; retrying in $((i * 3))s"
            rm -rf "$RUNNER_TEMP/driver-agents"
            [ "$i" -lt 5 ] && sleep "$((i * 3))"
          done
          set -e
          [ "$(git -C "$RUNNER_TEMP/driver-agents" rev-parse HEAD 2>/dev/null)" = "$DRIVER_AGENTS_REF" ] \
            || { echo "::error::driver-agents is not at the pinned revision $DRIVER_AGENTS_REF after 5 attempts"; exit 1; }
          [ -x "$RUNNER_TEMP/driver-agents/tools/shopify/admin-graphql.sh" ] \
            || { echo "::error::driver-agents clone failed after 5 attempts"; exit 1; }
          umask 077
          mkdir -p "$RUNNER_TEMP/shopify-stores"
          printf 'SHOP=%s\nCLIENT_ID=%s\nCLIENT_SECRET=%s\n' \
            "$SHOPIFY_SHOP" "$DRIVER_ENGINEERING_APP_CLIENT_ID" "$DRIVER_ENGINEERING_APP_CLIENT_SECRET" \
            > "$RUNNER_TEMP/shopify-stores/$SHOPIFY_STORE_NAME.env"
          {
            echo "DRIVER_AGENTS_DIR=$RUNNER_TEMP/driver-agents"
            echo "SHOPIFY_STORE_DIR=$RUNNER_TEMP/shopify-stores"
            echo "SHOPIFY_AUDIT_DIR=$RUNNER_TEMP/shopify-audit"
          } >> "$GITHUB_ENV"
          if [ -n "$SHOPIFY_ALERT_WEBHOOK" ]; then
            printf '%s\n' "$SHOPIFY_ALERT_WEBHOOK" > "$RUNNER_TEMP/shopify-alert-webhook"
            {
              echo "SHOPIFY_ALERT_WEBHOOK_FILE=$RUNNER_TEMP/shopify-alert-webhook"
              echo "SHOPIFY_ALERT_HOST_LABEL=GitHub Actions run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            } >> "$GITHUB_ENV"
          fi
          # No issue context: this is a manual run.
          CTX="$(jq -cn --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{run:$run, host:"github-actions"}')"
          echo "SHOPIFY_AUDIT_CONTEXT=$CTX" >> "$GITHUB_ENV"

      - name: Read-only smoke (token mint + shop + metaobject scope)
        run: |
          "$DRIVER_AGENTS_DIR/tools/shopify/admin-graphql.sh" --store "$SHOPIFY_STORE_NAME" \
            -q '{ shop { name currencyCode } }'
          "$DRIVER_AGENTS_DIR/tools/shopify/admin-graphql.sh" --store "$SHOPIFY_STORE_NAME" \
            -q '{ metaobjectDefinitions(first: 3) { nodes { type name } } }'
          echo "Shopify admin tool wiring verified for '$SHOPIFY_STORE_NAME'"

      # The audit log dies with the runner; run_attempt keeps a re-run's artifact name unique.
      - name: Upload Shopify audit artifact
        if: ${{ always() && env.SHOPIFY_AUDIT_DIR != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: shopify-audit-${{ env.SHOPIFY_STORE_NAME }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SHOPIFY_AUDIT_DIR }}
          if-no-files-found: ignore
