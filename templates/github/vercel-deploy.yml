name: Vercel deploy

# Caller stub: stages a Vercel build for each push to main that Vercel's GitHub app will not build
# because the pusher is outside the Vercel team. Production is a promotion in Vercel, never a push.
# The work lives in the reusable.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  deploy:
    uses: DriverDigital/workflows/.github/workflows/vercel-deploy.yml@884587adc424faf3abb16834f67a1f5520addfac # v1.21.0
    secrets:
      VERCEL_DEPLOY_HOOK_MAIN: ${{ secrets.VERCEL_DEPLOY_HOOK_MAIN }}
