name: Dependabot keep current

# Caller stub: rebases open Dependabot PRs left out of date when a merge lands on their base, or
# when the fleet wave dispatches it after a push. It acts only where branch protection requires
# up-to-date branches, and covers every base branch.

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  keep-current:
    uses: DriverDigital/workflows/.github/workflows/dependabot-keep-current.yml@1d5214a11adb0788353d3623782516fc14fad318 # v1.23.0
    secrets:
      AGENTS_GH_PAT: ${{ secrets.AGENTS_GH_PAT }}
