name: Close linked issues

# Closes the issues a merged PR names with a closing keyword (`Closes #12`, `fixes #12`, ...) when it
# merged into a branch other than the default (Palmers' main-*). GitHub honours those keywords only
# on the default branch, so a PR into main-in would otherwise leave its issue open.

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  close:
    if: >-
      github.event.pull_request.merged &&
      github.event.pull_request.base.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Close the issues the PR body names
        env:
          BODY: ${{ github.event.pull_request.body }}
          PR: ${{ github.event.pull_request.number }}
          # The default token, not AGENTS_GH_PAT: its close event cannot wake another workflow.
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Bare same-repo #N only: owner/repo#N names another repository.
          nums=$(grep -oiE '(^|[^[:alnum:]/_.-])(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#[0-9]+' <<<"$BODY" \
            | grep -oE '[0-9]+$' | sort -un || true)
          [ -n "$nums" ] || { echo "No closing keywords"; exit 0; }
          for n in $nums; do
            # A PR number shares the issue number space, and closing it would close the PR.
            info=$(gh api "repos/$GH_REPO/issues/$n" --jq '(if .pull_request then "pr" else "issue" end) + " " + .state' 2>/dev/null || echo "missing -")
            [ "$info" = "issue open" ] || { echo "#$n: $info; skipped"; continue; }
            gh issue close "$n" --reason completed --comment "Closed by #$PR, merged into \`${GITHUB_BASE_REF}\`."
          done
