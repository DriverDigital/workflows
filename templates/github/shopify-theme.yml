name: Shopify theme

# Caller stub for every theme push a Shopify site makes: a preview theme per pull request, draft or
# ready (pushed on open and every push, deleted on close), and DRIVER/<branch> on every push to main
# or a Palmers-style main-* branch. The work lives in the reusable it pins.

on:
  pull_request:
    branches: [main, "main-*"]
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main, "main-*"]

# pull-requests: write lets the reusable add the preview theme links to the PR description.
permissions:
  contents: read
  pull-requests: write

jobs:
  theme:
    # Dependabot PRs build in dependabot-validate instead, a fork PR gets no secrets, and a commit
    # from Shopify's GitHub integration is already on the theme it came from.
    if: >-
      (github.event_name == 'push' && !contains(github.event.head_commit.message, 'Update from Shopify')) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.login != 'dependabot[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: DriverDigital/workflows/.github/workflows/shopify-theme.yml@9e93a7a1d0a3a7e66ef7dcab196e1eb66e6d9832 # v1.20.0
    # inherit, not a map: environment secrets (Palmers) cannot be passed by name.
    secrets: inherit
